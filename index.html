<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Form Lamp Animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <!-- Abajur / Lampada -->
    <div class="lamp-wrapper">
      <div class="lamp">
        <div class="shade"></div>
        <div class="light"></div>
        <div class="stand"></div>
        <div class="base"></div>
        <div class="string" id="lampString">
          <div class="bead"></div>
        </div>
      </div>
    </div>

    <!-- Formulario de Login com integração do Web3Forms -->
    <div class="login-form">
      <h2>Welcome</h2>
      <form action="https://api.web3forms.com/submit" method="POST">
        <!-- Chave do Web3Forms -->
        <input type="hidden" name="access_key" value="6bb64ee2-8f17-4f80-bcda-d971f6ec285d" />

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter name" required autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter Password" required />
        </div>

        <button class="login-btn" type="submit">Sign In</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
